server:
  # Configuravel para permitir rodar as 3 demos do repositorio simultaneamente
  # (cada uma em uma porta), por exemplo para o harness de comparacao em benchmark/.
  port: ${SERVER_PORT:8080}

llm:
  # Limite de idas ao modelo por conversa (protege contra loops).
  max-iterations: 5

anthropic:
  # Chave lida da variavel de ambiente ANTHROPIC_API_KEY (nao versione a chave!).
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  max-tokens: 1024
  base-url: https://api.anthropic.com
  version: "2023-06-01"

demo:
  # Se true, roda exemplos no console durante o startup.
  run-on-startup: ${DEMO_RUN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info   # por padrao so "health" fica exposto

logging:
  level:
    br.uece.functioncalling: INFO
